version: '3.8'

services:
  graphite-statsd:
    image: graphiteapp/graphite-statsd:latest
    container_name: graphite-statsd
    restart: always
    ports:
      - "80:80"        # Graphite web interface
      - "2003-2004:2003-2004" # Graphite Line Receiver ports
      - "8125:8125/udp" # StatsD UDP port
      - "8126:8126"   # StatsD TCP port (optional, depends on StatsD configuration)

  nodejs_app:
    build: .

